---
# Connectivity test — AAP ↔ ServiceNow.
#
# Standalone on purpose: no roles, no artifacts, no AWS. If this passes, the credential,
# the EE and the PDI are all good and any later failure is in the demo logic, not the
# plumbing.
#
# It exercises the three operations the demo depends on:
#   1. read    — proves auth and network
#   2. create  — proves write access and the `caller` field resolves
#   3. update  — proves the work-note mechanic the whole demo rests on
#   4. resolve — proves close_code/close_notes, which Phase 4 needs
#
# Steps 4, 5 and 7 post dummy data in the exact shape Phases 2-4 will use, so you can
# see how multi-line notes actually render in ServiceNow before relying on them.
#
# Run in AAP with only the ServiceNow credential attached. Locally:
#   SN_HOST=… SN_USERNAME=… SN_PASSWORD=… ansible-playbook playbooks/test_servicenow.yml
#
# Options:
#   -e snow_test_caller=first.last   caller for the test ticket (default: admin)
#   -e snow_test_resolve=false       leave the ticket open instead of resolving it
#   -e snow_test_delete=true         delete the ticket afterwards (often needs admin)

- name: Test ServiceNow connectivity from AAP
  hosts: localhost
  gather_facts: false
  connection: local

  # A PDI routinely blows through the collection's 10s default on writes, especially
  # just after waking from hibernation. Honour SN_TIMEOUT if the credential sets it.
  environment:
    SN_TIMEOUT: "{{ snow_test_timeout }}"

  vars:
    snow_test_timeout: "{{ lookup('env', 'SN_TIMEOUT') | default(60, true) }}"
    snow_test_caller: admin
    snow_test_resolve: true
    snow_test_delete: false
    snow_test_close_code: "Solved (Permanently)"
    snow_host: "{{ lookup('env', 'SN_HOST') }}"

    # The collection ships an older ServiceNow close_code list (Duplicate, Known error,
    # Solution provided, …). Modern instances use the "Solved (…)" set, so every read
    # logs "Encountered unknown value … while mapping field close_code".
    #
    # Those warnings are cosmetic — an unmapped value is passed through verbatim — but
    # they look like errors on a demo screen. Supplying incident_mapping replaces the
    # list for that field and silences them. Identity mapping: the value ServiceNow
    # stores is the value Ansible uses.
    #
    # Trim or extend these to match your instance's actual choice lists.
    snow_incident_mapping:
      close_code:
        "": ""
        "Solved (Permanently)": "Solved (Permanently)"
        "Solved (Work Around)": "Solved (Work Around)"
        "Solved Remotely (Permanently)": "Solved Remotely (Permanently)"
        "Solved Remotely (Work Around)": "Solved Remotely (Work Around)"
        "Not Solved (Not Reproducible)": "Not Solved (Not Reproducible)"
        "Not Solved (Too Costly)": "Not Solved (Too Costly)"
        "Closed/Resolved by Caller": "Closed/Resolved by Caller"
      hold_reason:
        "": ""
        "1": awaiting_caller
        "2": "2"          # present on this instance, not in the collection's defaults
        "3": awaiting_problem
        "4": awaiting_vendor
        "5": awaiting_change

  tasks:
    - name: 1/7 — Confirm the credential injected (values never printed)
      ansible.builtin.assert:
        that:
          - lookup('env', 'SN_HOST') | length > 0
          - lookup('env', 'SN_USERNAME') | length > 0
          - lookup('env', 'SN_PASSWORD') | length > 0
        fail_msg: >-
          One or more of SN_HOST / SN_USERNAME / SN_PASSWORD is empty.
          In AAP: the ServiceNow credential is not attached to this job template, or the
          credential type's injector configuration has a typo.
          Locally: export the three variables before running.
        success_msg: "Credential injected: SN_HOST, SN_USERNAME and SN_PASSWORD are all set."

    - name: Show which instance we are talking to
      ansible.builtin.debug:
        msg: "Target instance: {{ snow_host }} (user: {{ lookup('env', 'SN_USERNAME') }})"

    - name: Run the lifecycle
      block:

        - name: 2/7 — Read existing incidents (proves auth + network + collection)
          servicenow.itsm.incident_info:  # noqa: args[module]
            incident_mapping: "{{ snow_incident_mapping }}"
          register: snow_read

        - name: Report what we could see
          ansible.builtin.debug:
            msg: >-
              Read OK — {{ snow_read.records | length }} incident(s) visible.
              Sample: {{ (snow_read.records | map(attribute='number') | list)[:3] | join(', ') | default('none', true) }}

        - name: 3/7 — Create a test incident
          servicenow.itsm.incident:  # noqa: args[module]
            incident_mapping: "{{ snow_incident_mapping }}"
            state: new
            caller: "{{ snow_test_caller }}"
            short_description: "[AAP connectivity test] safe to close"
            description: "Created by playbooks/test_servicenow.yml to verify AAP can reach ServiceNow."
            impact: low
            urgency: low
            other:
              work_notes: "Step 1 — ticket created by AAP."
          register: snow_created

        - name: Report the new ticket
          ansible.builtin.debug:
            msg:
              - "Created {{ snow_created.record.number }} ({{ snow_created.record.sys_id }})"
              - "View it: {{ snow_host }}/nav_to.do?uri=incident.do%3Fsys_id%3D{{ snow_created.record.sys_id }}"

        # The next two notes carry dummy data in the exact shape Phases 2 and 3 will
        # post. ServiceNow renders journal entries as HTML, which can collapse runs of
        # spaces, so column alignment that looks right in the playbook may not survive
        # to the activity stream. Posting both formats means one run answers the
        # question. Compare them on the ticket and tell me which reads better.

        - name: 4/7 — Post the Phase 2 instance block (space-aligned columns)
          servicenow.itsm.incident:  # noqa: args[module]
            incident_mapping: "{{ snow_incident_mapping }}"
            sys_id: "{{ snow_created.record.sys_id }}"
            description: "UPDATED by the connectivity test — this proves the update path works."
            other:
              work_notes: |
                EC2 instance provisioned.
                - Hostname:      web-demo-01
                - Instance ID:   i-0a1b2c3d4e5f67890
                - Instance type: t3.micro
                - Region / AZ:   us-east-2 / us-east-2a
                - AMI:           ami-0abcdef1234567890
                - Private IP:    10.0.1.47
                - Public IP:     3.142.59.26
                - Instance tagged with snow_incident={{ snow_created.record.number }}.

        - name: 5/7 — Post the Phase 3 patch summary (compact, no alignment padding)
          servicenow.itsm.incident:  # noqa: args[module]
            incident_mapping: "{{ snow_incident_mapping }}"
            sys_id: "{{ snow_created.record.sys_id }}"
            other:
              work_notes: |
                Patching complete on web-demo-01 (i-0a1b2c3d4e5f67890).
                - Packages updated: 47
                - Reboot required: yes
                - Kernel: 6.1.112-122.189.amzn2023 -> 6.1.119-129.201.amzn2023
                - Duration: 1m 52s

        - name: 6/7 — Read the ticket back and confirm the update landed
          servicenow.itsm.incident_info:  # noqa: args[module]
            incident_mapping: "{{ snow_incident_mapping }}"
            sys_id: "{{ snow_created.record.sys_id }}"
          register: snow_verify

        # Deliberately checks `description`, not `work_notes`: work notes are a journal
        # field and the Table API does not return their content in the record, so
        # asserting on them would fail even when the update succeeded.
        - name: Confirm the round-trip
          ansible.builtin.assert:
            that:
              - snow_verify.records | length == 1
              - "'UPDATED by the connectivity test' in snow_verify.records[0].description"
            fail_msg: >-
              The ticket was created but the update did not read back. Write access may
              be partial — check the service account's ACLs on the incident table.
            success_msg: "Update round-trip confirmed on {{ snow_created.record.number }}."

        # close_notes is a plain text field, not a journal field, so it may render
        # differently from the work notes above. Worth seeing both.
        - name: 7/7 — Resolve with the Phase 4 close notes
          servicenow.itsm.incident:  # noqa: args[module]
            incident_mapping: "{{ snow_incident_mapping }}"
            sys_id: "{{ snow_created.record.sys_id }}"
            state: resolved
            close_code: "{{ snow_test_close_code }}"
            close_notes: |
              Provisioned and patched by AAP.
                Instance:  web-demo-01 / i-0a1b2c3d4e5f67890
                Patched:   47 packages
                Rebooted:  yes
                AAP job:   https://aap.example.com/#/jobs/playbook/1234
            other:
              work_notes: "Resolved by AAP. This is dummy data from the connectivity test."
          when: snow_test_resolve | bool

        - name: Delete the test ticket
          servicenow.itsm.incident:  # noqa: args[module]
            sys_id: "{{ snow_created.record.sys_id }}"
            state: absent
          when: snow_test_delete | bool

        - name: PASS
          ansible.builtin.debug:
            msg:
              - "================ ServiceNow connectivity: PASS ================"
              - "Read:    ok"
              - "Create:  ok — {{ snow_created.record.number }}"
              - "Update:  ok — work notes + field change verified"
              - "Resolve: {{ 'ok' if snow_test_resolve | bool else 'skipped' }}"
              - "Deleted: {{ 'yes' if snow_test_delete | bool else 'no — ticket left for inspection' }}"
              - "{{ snow_host }}/nav_to.do?uri=incident.do%3Fsys_id%3D{{ snow_created.record.sys_id }}"
              - "---"
              - "Now open the ticket and check how the multi-line notes rendered:"
              - "  * Phase 2 block  — are the columns still aligned, or did the spaces collapse?"
              - "  * Phase 3 block  — compact '- key: value' lines, no alignment to lose"
              - "  * Close notes    — plain text field, may render differently again"
              - "Tell me which reads best and I'll standardise the real playbooks on it."
              - "==============================================================="
              - "==============================================================="

      rescue:
        - name: FAIL — likely causes
          ansible.builtin.debug:
            msg:
              - "================ ServiceNow connectivity: FAIL ================"
              - "Failed task: {{ ansible_failed_task.name | default('unknown') }}"
              - "Error: {{ ansible_failed_result.msg | default('see above') | truncate(300) }}"
              - "---"
              - "read operation timed out -> instance is slow; raise SN_TIMEOUT (currently {{ snow_test_timeout }}s)"
              - "401 / Unauthorized      -> wrong username or password in the credential"
              - "403 / Forbidden         -> service account is missing the itil role"
              - "Name or service unknown -> SN_HOST wrong, or the PDI is hibernating (log in to wake it)"
              - "couldn't resolve module -> servicenow.itsm missing from the execution environment"
              - "Invalid caller          -> pass -e snow_test_caller=<a real user_name>"
              - "close_code invalid      -> pass -e snow_test_close_code='<valid code for your instance>'"
              - "==============================================================="

        - name: Mark the play failed
          ansible.builtin.fail:
            msg: "ServiceNow connectivity test failed — see the diagnostics above."

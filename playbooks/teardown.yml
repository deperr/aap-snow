---
# Phase 5 — docs/mvp/phase-5-failure-and-teardown.md
#
# Terminates the instance this run deployed.
#
# In a workflow it needs nothing: ec2_instance_id arrives as an artifact from
# provision_ec2.yml. Standalone, give it a name instead:
#
#   ansible-playbook playbooks/teardown.yml -e create_vm_vm_name=web-demo-01

- name: Terminate the demo instance
  hosts: localhost
  gather_facts: false
  connection: local

  vars_files:
    - ../vars/demo.yml

  pre_tasks:
    - name: Require something to identify the instance
      ansible.builtin.assert:
        that:
          - (ec2_instance_id | default('', true) | length > 0)
            or (create_vm_vm_name | default('', true) | length > 0)
        fail_msg: >-
          Nothing to terminate. In a workflow ec2_instance_id arrives as an artifact
          from provision_ec2.yml; standalone, pass create_vm_vm_name.
        quiet: true

  tasks:
    # Only needed when running standalone. `tag-key: snow_incident` keeps the lookup to
    # instances this demo created — the APD tags these also carry would match APD's
    # whole cloud stack.
    - name: Look the instance up by name
      amazon.aws.ec2_instance_info:
        region: "{{ create_vm_aws_region }}"
        filters:
          "tag:Name": "{{ create_vm_vm_name }}"
          "tag-key": snow_incident
          instance-state-name: [pending, running, stopping, stopped]
      register: teardown_found
      when: ec2_instance_id | default('', true) | length == 0

    - name: Settle on the instance id
      ansible.builtin.set_fact:
        teardown_ids: >-
          {{ [ec2_instance_id] if (ec2_instance_id | default('', true) | length > 0)
             else (teardown_found.instances | default([]) | map(attribute='instance_id') | list) }}

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ ('Terminating: ' + teardown_ids | join(', '))
             if teardown_ids | length > 0
             else 'Nothing to terminate — no matching instance is running.' }}

    - name: Terminate
      amazon.aws.ec2_instance:
        region: "{{ create_vm_aws_region }}"
        instance_ids: "{{ teardown_ids }}"
        state: absent
        wait: true
      when: teardown_ids | length > 0

---
# Phase 2 — docs/mvp/phase-2-provision-ec2.md
#
# Launches the EC2 instance, tags it with the ticket number, and writes the *actual*
# instance facts back to the ticket.
#
# Variables match the Ansible Product Demos "Cloud | AWS | Create VM" survey exactly,
# so that survey can be attached to this job template unchanged:
#
#   create_vm_aws_region              AWS Region              (required)
#   create_vm_vm_name                 Name                    (required)
#   create_vm_vm_owner                Owner                   (required)
#   create_vm_vm_deployment           Deployment              (required)
#   create_vm_vm_purpose              Purpose                 (default: demo)
#   create_vm_vm_environment          Environment             (Dev | QA | Prod)
#   vm_blueprint                      Blueprint               (required)
#   create_vm_aws_vpc_subnet_name     Subnet                  (name, not id)
#   create_vm_aws_securitygroup_name  Security Group          (name, not id)
#   create_vm_aws_keypair_name        SSH Keypair             (required)
#   create_vm_aws_instance_size       AWS Instance Type       (default: t3.medium)
#   create_vm_aws_image_filter        AWS Image Filter        (default: RHEL 9)
#
# Also required, from Phase 1's artifacts: snow_sys_id, snow_number.

- name: Provision the EC2 instance
  hosts: localhost
  gather_facts: false
  connection: local

  vars_files:
    - ../vars/demo.yml

  pre_tasks:
    - name: Fail if variables not defined
      ansible.builtin.assert:
        that:
          - create_vm_aws_region | default("", true) | length > 0
          - create_vm_vm_name | default("", true) | length > 0
          - vm_blueprint | default("", true) | length > 0
          - create_vm_aws_vpc_subnet_name | default("", true) | length > 0
          - create_vm_aws_securitygroup_name | default("", true) | length > 0
          - create_vm_aws_keypair_name | default("", true) | length > 0
        fail_msg: >-
          Required variables not set. This template expects the APD
          "Cloud | AWS | Create VM" survey: create_vm_aws_region, create_vm_vm_name,
          vm_blueprint, create_vm_aws_vpc_subnet_name,
          create_vm_aws_securitygroup_name and create_vm_aws_keypair_name.
        quiet: true

    - name: Confirm the Phase 1 ticket artifacts arrived
      ansible.builtin.assert:
        that:
          - snow_sys_id | default("", true) | length > 0
          - snow_number | default("", true) | length > 0
        fail_msg: >-
          snow_sys_id and snow_number are missing. They are published by
          playbooks/snow_open_ticket.yml as workflow artifacts; this playbook is not
          meant to run before it.
        quiet: true

    # The defaults provision RHEL 9, and Phase 3 patches with ansible.builtin.dnf.
    # The APD survey still offers windows_core / windows_full, so catch that here
    # rather than tagging a RHEL box as Windows and failing two nodes later.
    - name: Reject blueprints this demo cannot patch
      ansible.builtin.assert:
        that:
          - "'windows' not in (vm_blueprint | default('') | lower)"
        fail_msg: >-
          Blueprint '{{ vm_blueprint }}' is not supported here. These playbooks
          provision RHEL-family images and Phase 3 patches with dnf.
        quiet: true

    # An unowned AMI search returns every public image matching the name across all
    # AWS accounts — slow to fetch and slow to sort.
    - name: Confirm the image search is constrained by owner
      ansible.builtin.assert:
        that:
          - create_vm_aws_image_owners | default('', true) | length > 0
        fail_msg: >-
          create_vm_aws_image_owners is empty. Set an account id, or the alias
          'amazon' for Amazon-published images.
        quiet: true

  tasks:
    - name: Get subnet info
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ create_vm_aws_region }}"
        filters:
          "tag:Name": "{{ create_vm_aws_vpc_subnet_name }}"
      register: create_vm_aws_subnet
      when: create_vm_aws_subnet_id is not defined

    - name: Confirm the subnet name resolved
      ansible.builtin.assert:
        that:
          - create_vm_aws_subnet.subnets | default([]) | length > 0
        fail_msg: >-
          No subnet tagged Name='{{ create_vm_aws_vpc_subnet_name }}' exists in
          {{ create_vm_aws_region }}. Check the name and the region against the APD
          cloud stack, or pass create_vm_aws_subnet_id directly to skip this lookup.
        quiet: true
      when: create_vm_aws_subnet_id is not defined

    - name: Save subnet id
      ansible.builtin.set_fact:
        create_vm_aws_subnet_id: "{{ create_vm_aws_subnet.subnets | map(attribute='id') | list | last }}"
      when: create_vm_aws_subnet_id is not defined

    # This task returns thousands of images — Red Hat alone publishes well over a
    # thousand RHEL-9 AMIs per region. The Jinja sort below handles that fine (30k
    # images sort in ~7s), but AAP has to serialise the whole result into its job-event
    # stream, and a 20MB+ event can stall the job for minutes. It looks like a hang on
    # the *next* task, because that task's header has already printed.
    #
    # `no_log` keeps the payload out of the event stream; `register` still captures it.
    # The debug task below restores the one fact worth seeing.
    - name: Find ami
      amazon.aws.ec2_ami_info:
        region: "{{ create_vm_aws_region }}"
        owners: "{{ create_vm_aws_image_owners }}"
        filters:
          name: "{{ create_vm_aws_image_filter }}"
          architecture: "{{ create_vm_aws_image_architecture }}"
          state: available
      register: create_vm_vm_amis
      no_log: true
      when: create_vm_aws_instance_ami is not defined

    - name: Report how many images matched
      ansible.builtin.debug:
        msg: >-
          {{ create_vm_vm_amis.images | default([]) | length }} image(s) matched
          '{{ create_vm_aws_image_filter }}' from owner {{ create_vm_aws_image_owners }}.
      when: create_vm_aws_instance_ami is not defined

    - name: Confirm the image filter matched something sortable
      ansible.builtin.assert:
        that:
          - create_vm_vm_amis.images | default([]) | selectattr('creation_date', 'defined') | list | length > 0
        fail_msg: >-
          No usable AMI in {{ create_vm_aws_region }}: filter
          '{{ create_vm_aws_image_filter }}' (arch
          {{ create_vm_aws_image_architecture }}, owners
          {{ create_vm_aws_image_owners }}) returned
          {{ create_vm_vm_amis.images | default([]) | length }} image(s), of which
          0 have a creation_date. Check the blueprint, or pass
          create_vm_aws_instance_ami directly to skip this lookup.
        quiet: true
      when: create_vm_aws_instance_ami is not defined

    # selectattr is not optional: a single AMI without a creation_date makes
    # sort(attribute='creation_date') fail for the whole list, and the resulting
    # "Error while resolving value" says nothing about which image caused it.
    - name: Save ami
      ansible.builtin.set_fact:
        create_vm_aws_instance_ami: >-
          {{ (create_vm_vm_amis.images | selectattr('creation_date', 'defined')
              | sort(attribute='creation_date') | last).image_id }}
      when: create_vm_aws_instance_ami is not defined

    - name: Create instance
      amazon.aws.ec2_instance:
        name: "{{ create_vm_vm_name }}"
        region: "{{ create_vm_aws_region }}"
        instance_type: "{{ create_vm_aws_instance_size }}"
        image_id: "{{ create_vm_aws_instance_ami | trim }}"
        key_name: "{{ create_vm_aws_keypair_name }}"
        vpc_subnet_id: "{{ create_vm_aws_subnet_id }}"
        security_group: "{{ create_vm_aws_securitygroup_name }}"
        # `started`, not `running`: it additionally waits for EC2 status checks to pass,
        # which is a far better handoff to the SSH wait in Phase 3.
        state: started
        wait: true
        wait_timeout: "{{ create_vm_aws_wait_timeout }}"
        # Tag set matches APD exactly, so APD's dynamic inventory, VPC report and
        # teardown all see this instance. snow_incident is this repo's addition.
        tags:
          Name: "{{ create_vm_vm_name }}"
          blueprint: "{{ vm_blueprint }}"
          environment: "{{ create_vm_vm_environment }}"
          deployment: "{{ create_vm_vm_deployment }}"
          owner: "{{ create_vm_vm_owner }}"
          purpose: "{{ create_vm_vm_purpose }}"
          managed-by: aap-product-demos
          apd: "true"
          snow_incident: "{{ snow_number }}"
      register: create_vm_aws_ec2_instance

    - name: Confirm exactly one instance matched
      ansible.builtin.assert:
        that:
          - create_vm_aws_ec2_instance.instances | default([]) | length == 1
        fail_msg: >-
          Expected 1 instance named '{{ create_vm_vm_name }}', got
          {{ create_vm_aws_ec2_instance.instances | default([]) | length }}. See the
          idempotency note in docs/mvp/phase-2-provision-ec2.md.
        quiet: true

    - name: Shorthand for the instance facts
      ansible.builtin.set_fact:
        ec2_facts: "{{ create_vm_aws_ec2_instance.instances[0] }}"

    - name: Publish instance facts to downstream nodes
      ansible.builtin.set_stats:
        data:
          # APD's artifact names, so APD-derived downstream jobs keep working.
          priv_network_private_ip: "{{ ec2_facts.private_ip_address | default('') }}"
          public_ip: "{{ ec2_facts.public_ip_address | default('') }}"
          # This repo's artifacts, consumed by Phases 3-5.
          ec2_instance_id: "{{ ec2_facts.instance_id }}"
          ec2_private_ip: "{{ ec2_facts.private_ip_address | default('') }}"
          ec2_public_ip: "{{ ec2_facts.public_ip_address | default('') }}"
          ec2_az: "{{ ec2_facts.placement.availability_zone }}"
          ec2_ami: "{{ ec2_facts.image_id }}"
        per_host: false

    # Decision 3: assembled now, consumed in Phase 7. See docs/mvp/architecture.md.
    - name: Publish CMDB-shaped facts (nothing consumes these yet)
      ansible.builtin.set_stats:
        data:
          ci_payload:
            name: "{{ create_vm_vm_name }}"
            ip_address: "{{ ec2_facts.private_ip_address | default('') }}"
            object_id: "{{ ec2_facts.instance_id }}"
            cpu_count: "{{ ec2_facts.cpu_options.core_count | default('') }}"
            environment: "{{ create_vm_vm_environment }}"
            os: Linux
        per_host: false

    - name: Record instance details on the ticket
      ansible.builtin.include_role:
        name: snow_ticket
        tasks_from: note
      vars:
        snow_ticket_note: |
          EC2 instance provisioned.
            Hostname:      {{ create_vm_vm_name }}
            Instance ID:   {{ ec2_facts.instance_id }}
            Instance type: {{ ec2_facts.instance_type }}
            Region / AZ:   {{ create_vm_aws_region }} / {{ ec2_facts.placement.availability_zone }}
            AMI:           {{ ec2_facts.image_id }}
            Blueprint:     {{ vm_blueprint }}
            Private IP:    {{ ec2_facts.private_ip_address | default('n/a') }}
            Public IP:     {{ ec2_facts.public_ip_address | default('none') }}
          Instance tagged with snow_incident={{ snow_number }}.

    - name: Summarise
      ansible.builtin.debug:
        msg:
          - "Instance:   {{ ec2_facts.instance_id }} ({{ ec2_facts.instance_type }})"
          - "Private IP: {{ ec2_facts.private_ip_address | default('n/a') }}"
          - "Ticket:     {{ snow_number }} updated with instance facts"

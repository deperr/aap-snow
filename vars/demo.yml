---
# Defaults for the EC2 playbooks. Variable names match the Ansible Product Demos
# "Cloud | AWS | Create VM" survey, so that survey drives these templates unchanged.
# These are play-level vars, so survey answers and `-e` both override them.

#######
# IMAGE AND SIZE — RHEL 9
#######
# The survey's optional "AWS Instance Type" and "AWS Image Filter" questions override
# these per run. Owners is quoted: unquoted it parses as an int, and the module's
# `owners` parameter expects strings.
create_vm_aws_image_owners: '309956199498'
create_vm_aws_instance_size: t3.medium
create_vm_aws_image_architecture: x86_64
create_vm_aws_image_filter: 'RHEL-9*HVM-*Hourly*'

#######
# PLACEMENT — resources created by the APD cloud stack. Names, not ids.
#######
create_vm_aws_region: us-east-2
create_vm_aws_vpc_subnet_name: aws-test-subnet
create_vm_aws_securitygroup_name: aws-test-sg
create_vm_aws_keypair_name: aws-test-key

#######
# TAGS AND METADATA — same values APD uses
#######
vm_blueprint: rhel9
create_vm_vm_purpose: demo
create_vm_vm_environment: Dev
create_vm_vm_deployment: default
create_vm_vm_owner: ansible

# How long to wait for the instance to pass EC2 status checks.
create_vm_aws_wait_timeout: 600

# SSH login user for the patch play.
#
# The AAP Machine credential supplies the private KEY; it does not supply a usable
# username here, because APD's credential is shared with its Windows demos. APD's own
# AWS inventory fills that gap with `compose: {ansible_user: "'ec2-user'"}`, and where
# APD uses add_host instead of that inventory it sets ansible_user: ec2-user directly.
# This repo uses add_host too, so it has to do the same.
create_vm_remote_user: ec2-user

# Deliberately NOT defaulted — every instance would otherwise share a name:
#   create_vm_vm_name

---
# Defaults for the EC2 playbooks. Variable names match the Ansible Product Demos
# "Cloud | AWS | Create VM" survey, so the same survey drives these templates.
# Play-level vars, so survey answers and `-e` both override them.

# Survey defaults, identical to the APD "Cloud | AWS | Create VM" survey, so a partial
# survey (or a bare `-e` run) still works. Anything the survey sends overrides these.
create_vm_vm_purpose: demo
create_vm_vm_environment: Dev
create_vm_vm_deployment: default
create_vm_vm_owner: ansible
create_vm_aws_region: us-east-2

# Resources created by the APD cloud stack. These are *names*, not ids.
create_vm_aws_vpc_subnet_name: aws-test-subnet
create_vm_aws_securitygroup_name: aws-test-sg
create_vm_aws_keypair_name: aws-test-key

# Deliberately NOT defaulted — these must be a conscious choice every run:
#   create_vm_vm_name   (every instance would otherwise be called the same thing)
#   vm_blueprint        (picks the OS, and therefore whether Phase 3 can patch it)

# How long to wait for the instance to pass EC2 status checks.
create_vm_aws_wait_timeout: 600

# Blueprint values, copied from APD cloud/blueprints/*.yml. The survey's
# "AWS Instance Type" and "AWS Image Filter" are optional and fall back to these.
# Windows blueprints are intentionally absent — Phase 3 patches with dnf.
create_vm_blueprints:
  al2023:
    instance_size: t3.medium
    image_architecture: x86_64
    image_filter: 'al2023-ami-2023*'
    image_owners: ''
  rhel9:
    instance_size: t3.medium
    image_architecture: x86_64
    image_filter: 'RHEL-9*HVM-*Hourly*'
    image_owners: '309956199498'
  rhel8:
    instance_size: t3.medium
    image_architecture: x86_64
    image_filter: 'RHEL-8*HVM-*Hourly*'
    image_owners: '309956199498'
  rhel7:
    instance_size: t3.medium
    image_architecture: x86_64
    image_filter: 'RHEL-7.9_HVM*'
    image_owners: '309956199498'
  kafka:
    instance_size: t3.medium
    image_architecture: x86_64
    image_filter: 'RHEL-9*HVM-*Hourly*'
    image_owners: '309956199498'

# NOTE: no SSH user here on purpose. The AAP **Machine credential** supplies the login
# user and private key; setting `ansible_user` anywhere in this repo would override it
# and defeat the credential. See docs/mvp/aap-setup.md § credential model.

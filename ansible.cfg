[defaults]
inventory = inventory/hosts.yml
# These MUST stay additive. Setting a bare `./collections` replaces the default search
# path, which drops /usr/share/ansible/collections — where an execution environment
# ships its bundled collections. In AAP that makes servicenow.itsm and amazon.aws
# invisible. Same reasoning for roles_path.
roles_path = ./roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = False
display_skipped_hosts = False
retry_files_enabled = False

[callback_default]
# Readable multi-line output. Replaces the old `stdout_callback = yaml`, which lived in
# community.general and was removed in that collection's 12.0.0.
result_format = yaml

[inventory]
unparsed_is_failed = True

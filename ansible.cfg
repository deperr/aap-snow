[defaults]
inventory = inventory/hosts.yml
roles_path = ./roles
collections_path = ./collections
host_key_checking = False
display_skipped_hosts = False
retry_files_enabled = False

[callback_default]
# Readable multi-line output. Replaces the old `stdout_callback = yaml`, which lived in
# community.general and was removed in that collection's 12.0.0.
result_format = yaml

[inventory]
unparsed_is_failed = True
